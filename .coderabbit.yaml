    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    actionlint:
      enabled: true
    github-checks:
      enabled: true
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    swiftlint:
      enabled: false
    golangci-lint:
      enabled: false
    rubocop:
      enabled: false
    brakeman:
      enabled: false
    detekt:
      enabled: false
    pmd:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    fortitudeLint:
      enabled: false
    prismaLint:
      enabled: false
    shopifyThemeCheck:
      enabled: false
    luacheck:
      enabled: false
    psscriptanalyzer:
      enabled: false
    blinter:
      enabled: false
    circleci:
      enabled: false
    clippy:
      enabled: false
    cppcheck:
      enabled: false
    clang:
      enabled: false
    sqlfluff:
      enabled: false

knowledge_base:
  learnings:
    scope: "local"
