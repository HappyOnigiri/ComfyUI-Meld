name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.3.0). Leave empty when using bump"
        required: false
        type: string
      bump:
        description: "How to bump the version. Use none when specifying version"
        required: false
        default: none
        type: choice
        options:
          - none
          - auto
          - major
          - minor
          - patch

# The version is resolved during the run, so releases are always serialized
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          # Install CPU-only torch first to avoid downloading the large CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - uses: HappyOnigiri/ReleaseActions/actions/prepare-release@main
        with:
          version: ${{ inputs.version }}
          bump: ${{ inputs.bump }}
          version-bump-type: pyproject
          pyproject-path: pyproject.toml
          post-bump-command: "npm --prefix ui ci && make ci"
          extra-paths-to-commit: |
            web/js/gallery_extension.js
            web/js/style.css
            web/js/index.js
          github-token: ${{ secrets.GH_TOKEN }}
