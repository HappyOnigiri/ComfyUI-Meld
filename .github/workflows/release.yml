name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version (e.g. 1.3.0)"
        required: true

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UI dependencies
        run: cd ui && npm ci

      - name: Install Python dependencies
        run: |
          # Install CPU-only torch first to avoid downloading the large CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - uses: HappyOnigiri/ShareSettings/actions/prepare-release@main
        with:
          version: ${{ inputs.version }}
          version-bump-type: pyproject
          pyproject-path: pyproject.toml
          post-bump-command: "make ci"
          extra-paths-to-commit: |
            web/js/gallery_extension.js
            web/js/style.css
            web/js/index.js
          github-token: ${{ secrets.GITHUB_TOKEN }}
